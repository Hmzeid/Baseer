<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A2540">
<title>Baseer · بصير by Veebase — Field Inspection Console</title>
<meta name="description" content="Baseer by Veebase: an Arabic-first AI field inspection console. Photos, video or a live camera become an evidence-grounded safety report, with corrective actions tracked to a human-approved closure.">
<meta name="author" content="Veebase">
<meta name="application-name" content="Baseer by Veebase">
<meta property="og:title" content="Baseer · بصير by Veebase">
<meta property="og:description" content="Arabic-first AI safety inspections: photo to report to verified closure.">
<meta property="og:type" content="website">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baseer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A2540'/%3E%3Cpath d='M3.5 12S6.6 6.8 12 6.8 20.5 12 20.5 12 17.4 17.2 12 17.2 3.5 12 3.5 12Z' fill='none' stroke='white' stroke-width='1.6'/%3E%3Ccircle cx='12' cy='12' r='2.8' fill='%23C9A94E'/%3E%3C/svg%3E">
<script>
  // Apply the saved theme before first paint (no light flash in dark mode).
  try {
    const t = localStorage.getItem("baseer_theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="gated">

<!-- ================= SIGN-IN ================= -->
<section id="view-login" class="login">
  <div class="login-art" aria-hidden="true">
    <div class="login-art-inner">
      <div class="brand brand-lg"><span class="logomark"></span><div><b>Baseer · بصير</b><small data-i18n="brandSub"></small></div></div>
      <h1 data-i18n="loginHero"></h1>
      <p data-i18n="loginHeroSub"></p>
      <ul class="login-points">
        <li><i data-icon="sparkles"></i><span data-i18n="loginP1"></span></li>
        <li><i data-icon="camera"></i><span data-i18n="loginP2"></span></li>
        <li><i data-icon="check-shield"></i><span data-i18n="loginP3"></span></li>
      </ul>
      <p class="made-by made-by-art"><span data-i18n="madeBy"></span> <b>Veebase</b></p>
    </div>
  </div>
  <div class="login-form-wrap">
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="brand brand-sm only-mobile"><span class="logomark"></span><div><b>Baseer · بصير</b></div></div>
      <h2 data-i18n="loginT"></h2>
      <p class="muted" data-i18n="loginHint"></p>
      <label class="field"><span data-i18n="loginUser"></span>
        <input id="loginUser" type="text" autocomplete="username" required></label>
      <label class="field"><span data-i18n="loginPass"></span>
        <div class="pw"><input id="loginPass" type="password" autocomplete="current-password" required>
          <button type="button" class="icon-btn pw-eye" data-toggle-pw="loginPass" data-i18n-title="showPw"><i data-icon="eye"></i></button></div></label>
      <p class="form-error hidden" id="loginErr" role="alert"></p>
      <button class="btn btn-primary btn-block" id="loginBtn" type="submit" data-i18n="loginGo"></button>
      <div class="login-foot">
        <span class="badge" id="loginMode"></span>
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-lang="ar">عربي</button><button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="icon-btn" data-theme-toggle data-i18n-title="theme"><i data-icon="moon"></i></button>
      </div>
      <p class="made-by only-mobile-block"><span data-i18n="madeBy"></span> <b>Veebase</b></p>
    </form>
  </div>
</section>

<!-- ================= APP SHELL ================= -->
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logomark"></span><div><b>Baseer · بصير</b><small data-i18n="brandSub"></small></div></div>
    <nav class="nav" aria-label="Main">
      <div class="nav-label" data-i18n="navOps"></div>
      <a href="#/overview" data-nav="overview"><i data-icon="grid"></i><span data-i18n="navOverview"></span></a>
      <a href="#/inspect" data-nav="inspect"><i data-icon="plus-square"></i><span data-i18n="navInspect"></span></a>
      <a href="#/live" data-nav="live"><i data-icon="camera"></i><span data-i18n="navLive"></span><span class="nav-dot hidden" id="navLiveDot"></span></a>
      <div class="nav-label" data-i18n="navRecords"></div>
      <a href="#/inspections" data-nav="inspections"><i data-icon="folder"></i><span data-i18n="navInspections"></span></a>
      <a href="#/cases" data-nav="cases"><i data-icon="clipboard"></i><span data-i18n="navCases"></span><span class="nav-count hidden" id="navCasesCount"></span></a>
      <a href="#/audit" data-nav="audit"><i data-icon="history"></i><span data-i18n="navAudit"></span></a>
      <div class="nav-label" data-i18n="navAdmin"></div>
      <a href="#/users" data-nav="users" id="navUsers" class="hidden"><i data-icon="users"></i><span data-i18n="navUsers"></span></a>
      <a href="#/account" data-nav="account"><i data-icon="user"></i><span data-i18n="navAccount"></span></a>
    </nav>
    <div class="side-foot">
      <div class="mode-card" id="modeCard">
        <span class="pulse"></span>
        <div><b id="modeCardT"></b><small id="modeCardS"></small></div>
      </div>
      <div class="user-chip">
        <span class="avatar" id="userAvatar">—</span>
        <div class="user-meta"><b id="userName">—</b><small id="userRole"></small></div>
        <button type="button" class="icon-btn" id="logoutBtn" data-i18n-title="logout"><i data-icon="logout"></i></button>
      </div>
      <p class="made-by side-made-by"><span data-i18n="madeBy"></span> <b>Veebase</b></p>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn only-mobile" id="menuBtn" aria-label="Menu"><i data-icon="menu"></i></button>
      <div class="titles">
        <p class="crumb" id="crumb"></p>
        <h1 id="pageTitle"></h1>
      </div>
      <form class="search" id="globalSearch" role="search">
        <i data-icon="search"></i>
        <input id="globalQ" type="search" data-i18n-ph="searchPh" autocomplete="off">
        <kbd>/</kbd>
      </form>
      <div class="top-actions">
        <span class="badge" id="modeBadge"></span>
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-lang="ar">عربي</button><button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="icon-btn" data-theme-toggle data-i18n-title="theme"><i data-icon="moon"></i></button>
      </div>
    </header>
    <p class="page-sub" id="pageSub"></p>

    <main id="content">
      <!-- ================= OVERVIEW ================= -->
      <section id="view-overview" class="view">
        <div class="toolbar">
          <a class="btn btn-accent" href="#/inspect"><i data-icon="plus"></i><span data-i18n="ctaNew"></span></a>
          <a class="btn btn-ghost" href="#/live"><i data-icon="camera"></i><span data-i18n="navLive"></span></a>
          <div class="spacer"></div>
          <label class="select-wrap"><i data-icon="pin"></i><select id="siteFilter" data-i18n-title="siteFilter"></select></label>
        </div>
        <div class="notice hidden" id="seedNotice"><i data-icon="info"></i><span data-i18n="seedNote"></span></div>
        <div class="kpis">
          <div class="kpi"><div class="kpi-icon tone-brand"><i data-icon="folder"></i></div><div><span class="kpi-k" data-i18n="aTotal"></span><b class="kpi-v" id="vTotal">–</b><small data-i18n="dTotal"></small></div></div>
          <div class="kpi"><div class="kpi-icon tone-accent"><i data-icon="eye"></i></div><div><span class="kpi-k" data-i18n="aFindings"></span><b class="kpi-v" id="vFindings">–</b><small id="dFindings"></small></div></div>
          <div class="kpi"><div class="kpi-icon tone-high"><i data-icon="alert"></i></div><div><span class="kpi-k" data-i18n="aHigh"></span><b class="kpi-v c-high" id="vHigh">–</b><small data-i18n="dHigh"></small></div></div>
          <a class="kpi" href="#/cases"><div class="kpi-icon tone-info"><i data-icon="clipboard"></i></div><div><span class="kpi-k" data-i18n="aOpen"></span><b class="kpi-v" id="vOpen">–</b><small id="dOpen"></small></div></a>
          <a class="kpi" href="#/cases?status=overdue"><div class="kpi-icon tone-med"><i data-icon="clock"></i></div><div><span class="kpi-k" data-i18n="aOverdue"></span><b class="kpi-v c-med" id="vOverdue">–</b><small data-i18n="dOverdue"></small></div></a>
        </div>
        <div class="grid g-21">
          <div class="card">
            <div class="card-head"><h2 data-i18n="trendT"></h2><span class="tag" id="trendTotal"></span></div>
            <div id="trendChart" class="chart"></div>
          </div>
          <div class="card">
            <div class="card-head"><h2 data-i18n="sevMix"></h2><span class="tag" id="sevTotal"></span></div>
            <div class="donut-wrap"><div id="sevDonut"></div><div class="legend" id="sevLegend"></div></div>
          </div>
        </div>
        <div class="grid g-11">
          <div class="card">
            <div class="card-head"><h2 data-i18n="topHazards"></h2></div>
            <div id="hazardBars" class="hbars"></div>
          </div>
          <div class="card">
            <div class="card-head"><h2 data-i18n="agingT"></h2><a class="link" href="#/cases" data-i18n="viewAll"></a></div>
            <div id="agingList" class="list"></div>
          </div>
        </div>
        <div class="grid g-11">
          <div class="card">
            <div class="card-head"><h2 data-i18n="recent"></h2><a class="link" href="#/inspections" data-i18n="viewAll"></a></div>
            <div id="recentList" class="list"></div>
          </div>
          <div class="card">
            <div class="card-head"><h2 data-i18n="pipeT"></h2></div>
            <p class="muted small" data-i18n="pipeHint"></p>
            <ol class="loop" id="loopSteps"></ol>
          </div>
        </div>
      </section>

      <!-- ================= NEW INSPECTION ================= -->
      <section id="view-inspect" class="view hidden">
        <div class="grid g-21">
          <form class="card" id="inspForm">
            <div class="card-head"><h2 data-i18n="newInspect"></h2><span class="tag" data-i18n="newHint"></span></div>
            <div class="drop" id="dropZone" tabindex="0" role="button">
              <input id="files" type="file" accept="image/*,video/*" multiple hidden>
              <div class="drop-icon"><i data-icon="upload"></i></div>
              <b data-i18n="dropTitle"></b>
              <small data-i18n="dropSub"></small>
            </div>
            <div class="thumbs" id="thumbs"></div>
            <label class="field"><span data-i18n="notes"></span>
              <textarea id="notes" rows="4" maxlength="5000" data-i18n-ph="notesPh"></textarea></label>
            <div class="row gap">
              <button id="micBtn" class="btn btn-ghost btn-sm" type="button"><i data-icon="mic"></i><span id="micLabel" data-i18n="micRec"></span></button>
              <span id="micStatus" class="muted small"></span>
              <span class="spacer"></span>
              <span class="muted small" id="notesCount">0 / 5000</span>
            </div>
            <label class="field"><span data-i18n="ctx"></span>
              <input id="ctx" type="text" list="siteList" data-i18n-ph="ctxPh"></label>
            <datalist id="siteList"></datalist>
            <div class="row gap mt">
              <button id="runBtn" class="btn btn-accent btn-lg" type="submit"><i data-icon="sparkles"></i><span data-i18n="run"></span></button>
              <button id="clearBtn" class="btn btn-ghost" type="button" data-i18n="clear"></button>
            </div>
          </form>
          <div class="stack">
            <div class="card">
              <div class="card-head"><h2 data-i18n="guideT"></h2></div>
              <ul class="checks" id="guideList"></ul>
              <p class="muted small" data-i18n="guideNote"></p>
            </div>
            <div class="card">
              <div class="card-head"><h2 data-i18n="howT"></h2></div>
              <ol class="steps" id="howSteps"></ol>
            </div>
          </div>
        </div>
        <div class="analyzing hidden" id="analyzing" role="status" aria-live="polite">
          <div class="analyzing-card">
            <div class="scanner"><span class="logomark"></span></div>
            <h3 data-i18n="running"></h3>
            <ol class="progress-steps" id="progressSteps"></ol>
          </div>
        </div>
      </section>

      <!-- ================= LIVE CAMERA ================= -->
      <section id="view-live" class="view hidden">
        <div class="grid g-21">
          <div class="card">
            <div class="stage" id="stage">
              <video id="camPreview" muted playsinline class="hidden"></video>
              <div class="stage-empty" id="stageEmpty"><i data-icon="camera"></i><span data-i18n="stageIdle"></span></div>
              <div class="stage-hud">
                <span class="live-pill hidden" id="livePill"><span class="pulse"></span>LIVE <span id="liveClock">00:00</span></span>
                <span class="stage-count" id="stageCount"></span>
              </div>
            </div>
            <div class="live-stats">
              <div><small data-i18n="kLiveState"></small><b id="vLiveState"></b></div>
              <div><small data-i18n="liveFrames"></small><b id="vLiveFrames">0</b></div>
              <div><small data-i18n="liveAlertsT"></small><b id="vLiveAlerts" class="c-high">0</b></div>
            </div>
            <div class="row gap wrap mt">
              <button id="liveStart" class="btn btn-primary" type="button"><i data-icon="play"></i><span data-i18n="liveStart"></span></button>
              <button id="liveCam" class="btn btn-ghost" type="button"><i data-icon="camera"></i><span id="liveCamLabel" data-i18n="liveCamT"></span></button>
              <button id="liveFileBtn" class="btn btn-ghost hidden" type="button"><i data-icon="image"></i><span data-i18n="liveSendFile"></span></button>
              <input id="liveFiles" type="file" accept="image/*,video/*" hidden>
              <span class="spacer"></span>
              <button id="liveFinish" class="btn btn-accent hidden" type="button"><i data-icon="check"></i><span data-i18n="liveFinish"></span></button>
            </div>
            <div class="row gap wrap mt hidden" id="resumeRow">
              <span class="muted small" data-i18n="resumeHint"></span>
              <select id="resumeSel"></select>
              <button id="resumeBtn" class="btn btn-ghost btn-sm" type="button" data-i18n="resume"></button>
            </div>
            <label class="field"><span data-i18n="liveCtx"></span><input id="liveCtx" type="text" list="siteList" data-i18n-ph="ctxPh"></label>
            <p class="muted small" id="liveStatus" data-i18n="liveHint"></p>
          </div>
          <div class="card">
            <div class="card-head"><h2 data-i18n="alertsT"></h2><span class="tag" id="alertsCount"></span></div>
            <div id="liveAlerts" class="alerts"></div>
          </div>
        </div>
      </section>

      <!-- ================= INSPECTIONS (history) ================= -->
      <section id="view-inspections" class="view hidden">
        <div class="card">
          <div class="toolbar in-card">
            <label class="input-icon"><i data-icon="search"></i><input id="histQ" type="search" data-i18n-ph="histSearchPh"></label>
            <label class="select-wrap"><i data-icon="pin"></i><select id="histSite"></select></label>
            <label class="select-wrap"><i data-icon="filter"></i><select id="histSev"></select></label>
            <span class="spacer"></span>
            <button class="btn btn-ghost btn-sm" type="button" id="histCsv"><i data-icon="download"></i><span data-i18n="csvBtn"></span></button>
          </div>
          <div class="table-wrap">
            <table class="table clickable">
              <thead><tr><th data-i18n="colId"></th><th data-i18n="colDate"></th><th data-i18n="thSite"></th><th data-i18n="colSource"></th><th data-i18n="colFindings"></th><th data-i18n="colCases"></th><th></th></tr></thead>
              <tbody id="histRows"></tbody>
            </table>
          </div>
          <div class="empty hidden" id="histEmpty"><i data-icon="folder"></i><b data-i18n="histEmpty"></b><a class="btn btn-accent btn-sm" href="#/inspect" data-i18n="ctaNew"></a></div>
        </div>
      </section>

      <!-- ================= REPORT ================= -->
      <section id="view-report" class="view hidden">
        <div class="empty card" id="reportEmpty">
          <i data-icon="file"></i><b data-i18n="noReport"></b><p class="muted" data-i18n="noReportHint"></p>
          <div class="row gap center"><a class="btn btn-accent" href="#/inspect" data-i18n="ctaNew"></a><a class="btn btn-ghost" href="#/inspections" data-i18n="navInspections"></a></div>
        </div>
        <div id="reportContent" class="report hidden">
          <div class="report-main">
            <div class="card report-hero">
              <div class="report-top">
                <div>
                  <div class="row gap wrap"><span class="badge" id="pipeBadge"></span><span class="badge badge-soft" id="srcBadge"></span></div>
                  <h2 class="report-title"><span data-i18n="report"></span> <span class="mono" id="rId"></span></h2>
                  <p class="muted small" id="rMeta"></p>
                </div>
                <div class="row gap wrap report-actions">
                  <button id="pdfBtn" class="btn btn-primary btn-sm" type="button"><i data-icon="download"></i><span data-i18n="pdfRep"></span></button>
                  <button id="printBtn" class="btn btn-ghost btn-sm" type="button"><i data-icon="printer"></i><span data-i18n="printRep"></span></button>
                  <button id="waBtn" class="btn btn-ghost btn-sm" type="button"><i data-icon="share"></i><span data-i18n="shareWa"></span></button>
                  <button id="copyLinkBtn" class="btn btn-ghost btn-sm" type="button"><i data-icon="link"></i><span data-i18n="copyLink"></span></button>
                </div>
              </div>
              <div class="sev-strip" id="sevStrip"></div>
              <div class="summary"><i data-icon="sparkles"></i><p id="rSummary"></p></div>
            </div>
            <div class="card" id="briefCard">
              <div class="card-head"><h2><i data-icon="users"></i> <span data-i18n="briefT"></span></h2><span class="tag" data-i18n="briefHint"></span></div>
              <div class="lang-chips" id="briefLangs" role="group"></div>
              <div class="brief-out" id="briefOut"></div>
              <div class="row gap wrap mt hidden" id="briefActions">
                <button type="button" class="btn btn-ghost btn-sm" id="briefCopy"><i data-icon="clipboard"></i><span data-i18n="briefCopy"></span></button>
                <button type="button" class="btn btn-ghost btn-sm" id="briefWa"><i data-icon="share"></i><span data-i18n="shareWa"></span></button>
                <button type="button" class="btn btn-ghost btn-sm" id="briefSpeak"><i data-icon="volume"></i><span data-i18n="briefRead"></span></button>
                <button type="button" class="btn btn-ghost btn-sm" id="briefRedo"><i data-icon="refresh"></i><span data-i18n="briefRedo"></span></button>
                <span class="spacer"></span><small class="muted" id="briefMeta"></small>
              </div>
            </div>
            <div class="card">
              <div class="card-head"><h2 data-i18n="tEvidence"></h2><span class="row gap"><button type="button" class="btn btn-ghost btn-sm hidden" id="segToggle"><i data-icon="scan"></i><span id="segToggleLabel"></span></button><span class="tag" id="evStamp"></span></span></div>
              <div class="gallery" id="rEvidence"></div>
            </div>
            <div class="card-head plain"><h2 data-i18n="findings"></h2><span class="tag" id="findingsCount"></span></div>
            <div id="rFindings" class="findings"></div>
          </div>
          <aside class="report-side">
            <div class="card chat-card">
              <div class="card-head"><h2><i data-icon="message"></i> <span data-i18n="chat"></span></h2></div>
              <p class="muted small" data-i18n="chatHint"></p>
              <div class="chips" id="chatChips"></div>
              <div class="chatlog" id="chatLog"></div>
              <form class="chat-input" id="chatForm">
                <input id="chatInput" type="text" maxlength="2000" data-i18n-ph="chatPh" autocomplete="off">
                <button type="submit" class="icon-btn icon-btn-primary" data-i18n-title="send"><i data-icon="send"></i></button>
              </form>
            </div>
          </aside>
        </div>
      </section>

      <!-- ================= CASES ================= -->
      <section id="view-cases" class="view hidden">
        <div class="card">
          <div class="toolbar in-card">
            <div class="tabs" id="caseTabs" role="tablist"></div>
            <span class="spacer"></span>
            <label class="select-wrap"><i data-icon="pin"></i><select id="caseSite"></select></label>
            <button class="btn btn-ghost btn-sm" type="button" id="casesCsv"><i data-icon="download"></i><span data-i18n="csvBtn"></span></button>
          </div>
          <div class="table-wrap">
            <table class="table clickable">
              <thead><tr><th data-i18n="colCase"></th><th data-i18n="colCaseSev"></th><th data-i18n="colStatus"></th><th data-i18n="colAssignee"></th><th data-i18n="colDue"></th><th data-i18n="thSite"></th></tr></thead>
              <tbody id="caseRows"></tbody>
            </table>
          </div>
          <div class="empty hidden" id="casesEmpty"><i data-icon="check-shield"></i><b data-i18n="casesEmpty"></b></div>
        </div>
      </section>

      <!-- ================= AUDIT ================= -->
      <section id="view-audit" class="view hidden">
        <div class="card">
          <div class="toolbar in-card">
            <label class="input-icon"><i data-icon="search"></i><input id="auditQ" type="search" data-i18n-ph="auditSearchPh"></label>
            <label class="select-wrap"><i data-icon="filter"></i><select id="auditAction"></select></label>
            <span class="spacer"></span>
            <button id="csvBtn" class="btn btn-ghost btn-sm" type="button"><i data-icon="download"></i><span data-i18n="csvBtn"></span></button>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead><tr><th data-i18n="thTime"></th><th data-i18n="thAuditId"></th><th data-i18n="thSite"></th><th data-i18n="thFindingN"></th><th data-i18n="thAction"></th><th data-i18n="thActor"></th><th data-i18n="thDetail"></th></tr></thead>
              <tbody id="auditRows"></tbody>
            </table>
          </div>
          <div class="empty hidden" id="auditEmpty"><i data-icon="history"></i><b data-i18n="auditEmpty"></b></div>
        </div>
      </section>

      <!-- ================= USERS (admin) ================= -->
      <section id="view-users" class="view hidden">
        <div class="grid g-21">
          <div class="card">
            <div class="card-head"><h2 data-i18n="tUsers"></h2><span class="tag" id="usersCount"></span></div>
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th data-i18n="thUName"></th><th data-i18n="thURole"></th><th data-i18n="thUCreated"></th><th></th></tr></thead>
                <tbody id="userRows"></tbody>
              </table>
            </div>
          </div>
          <form class="card" id="newUserForm">
            <div class="card-head"><h2 data-i18n="tNewUser"></h2></div>
            <label class="field"><span data-i18n="tNuName"></span><input id="nuName" type="text" required autocomplete="off"></label>
            <label class="field"><span data-i18n="tNuPass"></span><input id="nuPass" type="password" minlength="8" required autocomplete="new-password"></label>
            <label class="field"><span data-i18n="tNuRole"></span><select id="nuRole"></select></label>
            <p class="form-error hidden" id="nuErr" role="alert"></p>
            <button class="btn btn-accent btn-block mt" type="submit"><i data-icon="plus"></i><span data-i18n="nuAdd"></span></button>
          </form>
        </div>
      </section>

      <!-- ================= ACCOUNT ================= -->
      <section id="view-account" class="view hidden">
        <div class="grid g-11">
          <div class="card">
            <div class="profile">
              <span class="avatar avatar-lg" id="accAvatar"></span>
              <div><h2 id="accName"></h2><span class="badge badge-soft" id="accRole"></span></div>
            </div>
            <div class="prefs">
              <div class="pref"><div><b data-i18n="prefLang"></b><small class="muted" data-i18n="prefLangHint"></small></div>
                <div class="seg" role="group"><button type="button" data-lang="ar">عربي</button><button type="button" data-lang="en">EN</button></div></div>
              <div class="pref"><div><b data-i18n="prefTheme"></b><small class="muted" data-i18n="prefThemeHint"></small></div>
                <div class="seg" role="group"><button type="button" data-set-theme="light" data-i18n="light"></button><button type="button" data-set-theme="dark" data-i18n="dark"></button></div></div>
            </div>
            <p class="muted small mt" id="aboutLine"></p>
          </div>
          <form class="card" id="pwForm">
            <div class="card-head"><h2 data-i18n="tMyPass"></h2></div>
            <label class="field"><span data-i18n="tPwOld"></span><input id="pwOld" type="password" required autocomplete="current-password"></label>
            <label class="field"><span data-i18n="tPwNew"></span><input id="pwNew" type="password" minlength="8" required autocomplete="new-password"></label>
            <button class="btn btn-primary mt" type="submit" data-i18n="pwChange"></button>
          </form>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="modal" id="modal">
  <form method="dialog" class="modal-card" id="modalForm">
    <h3 id="modalTitle"></h3>
    <p class="muted" id="modalBody"></p>
    <input id="modalInput" class="hidden" type="password" autocomplete="new-password">
    <div class="row gap end mt">
      <button class="btn btn-ghost" type="button" id="modalCancel"></button>
      <button class="btn btn-primary" value="ok" id="modalOk"></button>
    </div>
  </form>
</dialog>
<div class="lightbox hidden" id="lightbox"><button type="button" class="icon-btn" id="lightboxClose" aria-label="Close"><i data-icon="x"></i></button><div class="lb-frame"><img id="lightboxImg" alt=""><div class="seg-layer" id="lightboxSegs"></div></div></div>

<script src="/static/app.js"></script>
</body>
</html>
